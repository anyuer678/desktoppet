appId: com.desktoppet.app
productName: DesktopPet
directories:
  output: release
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: characters
    to: characters
  - from: plugins
    to: plugins
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DesktopPet
