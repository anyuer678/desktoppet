appId: com.desktoppet.app
productName: DesktopPet
extraMetadata:
  # 安装态 package.json 注入 productName，使 app.getName()/userData 为 DesktopPet
  # （与 lumen petpush 读取的 %APPDATA%/DesktopPet/pushApi.json 对齐）
  productName: DesktopPet
publish:
  provider: github
  owner: anyuer678
  repo: desktoppet
directories:
  output: release
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: characters
    to: characters
  - from: plugins
    to: plugins
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DesktopPet
