name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + headless smoke tests with coverage floor
        run: npm run test:coverage
      - name: Build (electron-vite)
        run: npm run build
      - name: Verify dist artifacts
        run: |
          set -e
          test -f out/main/index.js
          test -f out/preload/index.js
          test -f out/renderer/index.html
          echo "dist artifacts OK"
          ls -la out/main out/preload out/renderer | head -40
